[project]
name = "doaide-code"
version = "0.1.0"
description = "Multi-model coding harness: routes each message to the cheapest capable executor."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pydantic>=2.12",
    "typesafe-sdk>=0.7.5",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doaide-code = "doaide_code.main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doaide_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
